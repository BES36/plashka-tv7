<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script>
  // 👇 ВСТАВЬТЕ ВАШ КЛЮЧ ОТ WEATHERAPI.COM МЕЖДУ КАВЫЧЕК:
  const MY_KEY = "https://api.weatherapi.com/v1/current.json?key=5232fcf019b642c497a103208260311&q=Kirensk";
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .badge {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 300;
    font-size: 28px;
    color: #FFFFFF;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    
    -webkit-text-stroke: 1.5px #000000;
    paint-order: stroke fill;
    text-shadow: 
      -1px -1px 0 #000,  
       1px -1px 0 #000,
      -1px  1px 0 #000,
       1px  1px 0 #000;

    transition: none !important;
    animation: none !important;
    user-select: none;
  }
</style>
</head>
<body>

  <div id="info-badge" class="badge">КИРЕНСК</div>

  <script>
    const badge = document.getElementById("info-badge");
    let step = 0;
    let currentTemp = "ЗАГРУЗКА...";

    // 1. Попытка получить погоду с WeatherAPI.com через JSONP (в обход CORS)
    function fetchWeather() {
      const cleanKey = MY_KEY.trim();
      if (!cleanKey || cleanKey === "ВСТАВИТЬ_СЮДА") {
        fetchFallbackWeather();
        return;
      }

      const oldScript = document.getElementById("jsonp-weather");
      if (oldScript) oldScript.remove();

      const script = document.createElement("script");
      script.id = "jsonp-weather";
      script.src = `https://weatherapi.com{cleanKey}&q=Kirensk&callback=handleWeatherAPI`;
      
      // Если WeatherAPI заблокирован сетью или недоступен — включаем резервный источник
      script.onerror = function() {
        fetchFallbackWeather();
      };

      document.body.appendChild(script);
    }

    // Обработчик ответа от WeatherAPI.com
    window.handleWeatherAPI = function(data) {
      if (data && data.current && typeof data.current.temp_c === "number") {
        const temp = Math.round(data.current.temp_c);
        currentTemp = (temp > 0 ? `+${temp}` : `${temp}`) + "°C";
      } else {
        fetchFallbackWeather();
      }
    };

    // 2. Резервный источник (Open-Meteo для Киренска: 57.78, 108.12)
    async function fetchFallbackWeather() {
      try {
        const res = await fetch("https://open-meteo.com");
        const data = await res.json();
        const temp = Math.round(data.current_weather.temperature);
        currentTemp = (temp > 0 ? `+${temp}` : `${temp}`) + "°C";
      } catch (e) {
        currentTemp = "НЕТ СЕТИ";
      }
    }

    function getKirenskDateTime() {
      const now = new Date();
      const utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
      const kirenskDate = new Date(utcTime + (3600000 * 8));

      const day = String(kirenskDate.getDate()).padStart(2, '0');
      const month = String(kirenskDate.getMonth() + 1).padStart(2, '0');
      const year = kirenskDate.getFullYear();

      const hours = String(kirenskDate.getHours()).padStart(2, '0');
      const minutes = String(kirenskDate.getMinutes()).padStart(2, '0');

      return {
        dateStr: `${day}.${month}.${year}`,
        timeStr: `${hours}:${minutes}`
      };
    }

    function updateBadge() {
      const dt = getKirenskDateTime();

      switch (step) {
        case 0: badge.textContent = "КИРЕНСК"; break;
        case 1: badge.textContent = dt.dateStr; break;
        case 2: badge.textContent = dt.timeStr; break;
        case 3: badge.textContent = currentTemp; break;
      }

      step = (step + 1) % 4;
    }

    updateBadge();
    fetchWeather();

    setInterval(updateBadge, 10000);
    setInterval(fetchWeather, 15 * 60 * 1000);
  </script>

</body>
</html>
