<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<script>
  // 👇 Твой API-ключ WeatherAPI (только сам ключ)
  const API_KEY = "5232fcf019b642c497a103208260311";
  const CITY = "Kirensk";
</script>
<style>
  body {
    margin: 0;
    padding: 0;
    background: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
  }

  .badge {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 300;
    font-size: 28px;
    color: #FFFFFF;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    
    -webkit-text-stroke: 1.5px #000000;
    paint-order: stroke fill;
    text-shadow: 
      -1px -1px 0 #000,  
       1px -1px 0 #000,
      -1px  1px 0 #000,
       1px  1px 0 #000;

    transition: none !important;
    animation: none !important;
    user-select: none;
  }
</style>
</head>
<body>

  <div id="info-badge" class="badge">КИРЕНСК</div>

  <script>
    const badge = document.getElementById("info-badge");
    let step = 0;
    let currentTemp = "ЗАГРУЗКА...";

    function fetchWeather() {
      if (!API_KEY || API_KEY === "ВСТАВИТЬ_СЮДА") {
        currentTemp = "НЕТ КЛЮЧА";
        return;
      }

      const url = `https://api.weatherapi.com/v1/current.json?key=${API_KEY}&q=${CITY}&aqi=no`;
      
      fetch(url)
        .then(res => {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(data => {
          if (data && data.current && typeof data.current.temp_c === 'number') {
            const temp = Math.round(data.current.temp_c);
            currentTemp = (temp > 0 ? `+${temp}` : `${temp}`) + "°C";
            // Сохраняем в кэш на случай временных сбоев сети
            localStorage.setItem('kirensk_last_temp', currentTemp);
          }
        })
        .catch(err => {
          console.error("Ошибка загрузки погоды:", err);
          // Пытаемся достать из кэша, если сеть моргнула
          const cached = localStorage.getItem('kirensk_last_temp');
          if (cached) {
            currentTemp = cached;
          } else {
            currentTemp = "ERR NET";
          }
        });
    }

    function getKirenskDateTime() {
      const now = new Date();
      const utcTime = now.getTime() + (now.getTimezoneOffset() * 60000);
      const kirenskDate = new Date(utcTime + (3600000 * 8)); // Часовой пояс Киренска (UTC+8)

      const day = String(kirenskDate.getDate()).padStart(2, '0');
      const month = String(kirenskDate.getMonth() + 1).padStart(2, '0');
      const year = kirenskDate.getFullYear();

      const hours = String(kirenskDate.getHours()).padStart(2, '0');
      const minutes = String(kirenskDate.getMinutes()).padStart(2, '0');

      return {
        dateStr: `${day}.${month}.${year}`,
        timeStr: `${hours}:${minutes}`
      };
    }

    function updateBadge() {
      const dt = getKirenskDateTime();

      switch (step) {
        case 0: badge.textContent = "КИРЕНСК"; break;
        case 1: badge.textContent = dt.dateStr; break;
        case 2: badge.textContent = dt.timeStr; break;
        case 3: badge.textContent = currentTemp; break;
      }

      step = (step + 1) % 4;
    }

    // Первичный запуск
    updateBadge();
    fetchWeather();

    // Интервалы
    setInterval(updateBadge, 10000); // Смена информации каждые 10 секунд
    setInterval(fetchWeather, 15 * 60 * 1000); // Обновление погоды каждые 15 минут
  </script>

</body>
</html>
